<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>智能电商客服 · 小智</title>
    <meta name="description" content="基于知识库与大模型应答的智能电商客服" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="stage">
      <section class="console" aria-label="客服会话">
        <header class="console-head">
          <div class="identity">
            <span class="monogram" aria-hidden="true">智</span>
            <div class="identity-copy">
              <span class="name">小智</span>
              <span class="role">智能电商客服</span>
            </div>
          </div>
          <div class="head-right">
            <span class="presence is-pending" id="presence">
              <span class="dot"></span>
              <span class="presence-text">连接中</span>
            </span>
            <button class="ghost-btn" id="resetBtn" type="button">新对话</button>
          </div>
        </header>

        <div class="thread" id="thread" aria-live="polite"></div>

        <div class="composer-wrap">
          <form class="composer" id="chatForm">
            <input
              id="questionInput"
              name="question"
              autocomplete="off"
              placeholder="请描述您的问题…"
              required
            />
            <button class="send" id="sendBtn" type="submit" aria-label="发送">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5" /><path d="m5 12 7-7 7 7" /></svg>
            </button>
          </form>
          <p class="disclaimer">演示项目，回答由大模型结合商品与售后知识库生成，仅供参考。</p>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
